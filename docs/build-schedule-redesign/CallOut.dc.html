<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
  <style>
    body { margin: 0; font-family: 'Roboto', system-ui, -apple-system, sans-serif; }
    a { color: #e85a24; } a:hover { color: #cf4b1b; }
    * { box-sizing: border-box; }
  </style>
</helmet>

<div style="width: 390px; min-height: 844px; background: #0f172a; padding: 0 0 24px;">

  <div style="padding: 14px 16px 12px; display: flex; flex-direction: column; gap: 10px;">
    <div style="display: flex; align-items: center; gap: 8px;">
      <button style="width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; border: 1px solid rgba(255,255,255,0.18); border-radius: 10px; background: rgba(255,255,255,0.06); color: #f8fafc;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
      <button style="flex: 1 1 auto; display: flex; align-items: center; justify-content: center; gap: 8px; height: 34px; border: 1px solid rgba(255,255,255,0.18); border-radius: 10px; background: rgba(255,255,255,0.06); color: #f8fafc; font: inherit; font-weight: 700; font-size: 0.95rem;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4M3 10h18"/></svg>Sep 1 – 7</button>
      <button style="width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; border: 1px solid rgba(255,255,255,0.18); border-radius: 10px; background: rgba(255,255,255,0.06); color: #f8fafc;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></button>
      <button style="width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; border: 1px solid rgba(255,255,255,0.18); border-radius: 10px; background: rgba(255,255,255,0.06); color: #f8fafc;"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg></button>
    </div>
    <div style="display: flex; align-items: center; gap: 10px;">
      <span style="display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; background: rgba(34,197,94,0.18); color: #4ade80; font-size: 0.72rem; font-weight: 800;"><span style="width: 6px; height: 6px; border-radius: 999px; background: #22c55e;"></span>PUBLISHED</span>
      <span style="color: rgba(248,250,252,0.72); font-size: 0.78rem; font-weight: 500;">1 needs coverage</span>
      <span style="flex: 1 1 auto;"></span>
      <button style="display: inline-flex; align-items: center; justify-content: center; height: 40px; padding: 0 20px; border-radius: 10px; background: linear-gradient(135deg, #ff6b35 0%, #e85a24 100%); color: #fff; font: inherit; font-weight: 700; font-size: 0.9rem; box-shadow: 0 12px 24px rgba(232,90,36,0.32);">Publish</button>
    </div>
  </div>

  <div style="margin: 4px 12px 0; background: #fff; border: 1px solid rgba(203,213,225,0.55); border-radius: 16px; box-shadow: 0 16px 34px rgba(15,23,42,0.28); padding: 14px;">

    <!-- copy-conflict review strip -->
    <div style="display: flex; align-items: center; gap: 8px; padding: 9px 12px; border-radius: 10px; background: rgba(245,158,11,0.14); color: #92400e; font-size: 0.82rem; font-weight: 700; margin-bottom: 12px;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.7L1.8 18a2 2 0 001.7 3h16.9a2 2 0 001.7-3L13.7 3.7a2 2 0 00-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg>
      Copied last week &middot; 2 conflicts to review
    </div>

    <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 12px;">
      <div style="display: flex; gap: 7px; overflow-x: auto; flex: 1 1 auto;">
        <span style="flex: 0 0 auto; padding: 7px 13px; border-radius: 999px; background: #14213d; color: #fff; font-size: 0.82rem; font-weight: 700;">All</span>
        <span style="flex: 0 0 auto; padding: 7px 13px; border-radius: 999px; background: #fff; border: 1px solid rgba(15,23,42,0.12); color: #475569; font-size: 0.82rem; font-weight: 700;">Server</span>
        <span style="flex: 0 0 auto; padding: 7px 13px; border-radius: 999px; background: #fff; border: 1px solid rgba(15,23,42,0.12); color: #475569; font-size: 0.82rem; font-weight: 700;">Cook</span>
      </div>
      <div style="flex: 0 0 auto; display: inline-flex; padding: 3px; border-radius: 999px; background: rgba(15,23,42,0.06);">
        <span style="padding: 6px 12px; border-radius: 999px; background: #fff; color: #14213d; font-size: 0.78rem; font-weight: 800; box-shadow: 0 1px 2px rgba(15,23,42,0.12);">Day</span>
        <span style="padding: 6px 12px; border-radius: 999px; color: #475569; font-size: 0.78rem; font-weight: 800;">Week</span>
      </div>
    </div>

    <div style="display: flex; gap: 6px; overflow-x: auto; margin-bottom: 14px;">
      <span style="flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 44px; padding: 7px 9px; border: 1px solid rgba(15,23,42,0.12); border-radius: 12px; color: #475569;"><span style="font-size: 0.66rem; font-weight: 800;">SUN</span><span style="font-size: 0.95rem; font-weight: 700;">1</span></span>
      <span style="flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 44px; padding: 7px 9px; border: 1px solid rgba(15,23,42,0.12); border-radius: 12px; color: #475569;"><span style="font-size: 0.66rem; font-weight: 800;">MON</span><span style="font-size: 0.95rem; font-weight: 700;">2</span></span>
      <span style="flex: 0 0 auto; position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 44px; padding: 7px 9px; border: 1px solid #14213d; border-radius: 12px; background: #14213d; color: #fff;"><span style="position: absolute; top: 5px; right: 6px; width: 7px; height: 7px; border-radius: 999px; background: #f59e0b;"></span><span style="font-size: 0.66rem; font-weight: 800;">TUE</span><span style="font-size: 0.95rem; font-weight: 700;">3</span></span>
      <span style="flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 44px; padding: 7px 9px; border: 1px solid rgba(15,23,42,0.12); border-radius: 12px; color: #475569;"><span style="font-size: 0.66rem; font-weight: 800;">WED</span><span style="font-size: 0.95rem; font-weight: 700;">4</span></span>
      <span style="flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 44px; padding: 7px 9px; border: 1px solid rgba(15,23,42,0.12); border-radius: 12px; color: #475569;"><span style="font-size: 0.66rem; font-weight: 800;">THU</span><span style="font-size: 0.95rem; font-weight: 700;">5</span></span>
      <span style="flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 44px; padding: 7px 9px; border: 1px solid rgba(15,23,42,0.12); border-radius: 12px; color: #475569;"><span style="font-size: 0.66rem; font-weight: 800;">FRI</span><span style="font-size: 0.95rem; font-weight: 700;">6</span></span>
    </div>

    <h3 style="margin: 0 0 12px; font-size: 1rem; font-weight: 700; color: #14213d;">Tuesday, Sep 3</h3>

    <div style="display: flex; flex-direction: column; gap: 12px;">

      <!-- call-out: needs coverage -->
      <div style="padding: 13px; border: 1px solid rgba(15,23,42,0.1); border-left: 4px solid #dc2626; border-radius: 12px; background: rgba(239,68,68,0.06);">
        <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 8px;">
          <div style="display: flex; align-items: baseline; gap: 8px;"><strong style="color: #14213d; font-size: 0.95rem;">Server</strong><span style="color: #475569; font-size: 0.84rem;">11a&ndash;4p</span></div>
          <span style="font-weight: 800; font-size: 0.85rem; color: #b91c1c;">1/2</span>
        </div>
        <p style="display: flex; align-items: center; gap: 6px; margin: 0 0 10px; font-size: 0.83rem; font-weight: 800; color: #b91c1c;">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="#ea580c"><path d="M12 2c1 2.6-.4 4.3-1.5 5.6C9 9.2 8 10.7 8 12.5a4 4 0 008 0c0-1.4-.6-2.4-1.4-3.6 2.4.7 3.4 3 3.4 5A7 7 0 015 13.9C5 9 8.6 6 12 2z"/></svg>
          Maria Chen called out &mdash; needs coverage
        </p>
        <div style="display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px;">
          <span style="display: inline-flex; align-items: center; gap: 6px; padding: 5px 6px 5px 12px; border-radius: 999px; background: #fff; border: 1px solid rgba(15,23,42,0.12); font-size: 0.83rem; font-weight: 600; color: #14213d;">Devon Blake <span style="display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px; border-radius: 999px; background: rgba(15,23,42,0.08); color: #475569;"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg></span></span>
        </div>
        <button style="display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 10px; border: 1px solid transparent; background: linear-gradient(135deg, #ff6b35 0%, #e85a24 100%); color: #fff; font: inherit; font-weight: 700; font-size: 0.83rem; box-shadow: 0 10px 20px rgba(232,90,36,0.28);">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 00-4-4H6a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/></svg>
          Find replacement
        </button>
      </div>

      <!-- copy-conflict chip -->
      <div style="padding: 13px; border: 1px solid rgba(15,23,42,0.1); border-left: 4px solid rgba(245,158,11,0.7); border-radius: 12px; background: rgba(248,250,252,0.7);">
        <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 10px;">
          <div style="display: flex; align-items: baseline; gap: 8px;"><strong style="color: #14213d; font-size: 0.95rem;">Cook</strong><span style="color: #475569; font-size: 0.84rem;">11a&ndash;close</span></div>
          <span style="font-weight: 800; font-size: 0.85rem; color: #b45309;">1/2</span>
        </div>
        <div style="display: flex; flex-wrap: wrap; gap: 8px;">
          <span style="display: inline-flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 7px 12px; border-radius: 999px; background: rgba(245,158,11,0.1); border: 1px solid rgba(245,158,11,0.4); color: #92400e; font-size: 0.82rem;">
            <span style="font-weight: 700;">Kai Rivera &middot; now off Tuesdays</span>
            <span style="display: inline-flex; gap: 6px;">
              <span style="padding: 3px 10px; border-radius: 999px; background: rgba(15,23,42,0.08); color: #14213d; font-weight: 800; font-size: 0.76rem;">Replace</span>
              <span style="padding: 3px 10px; border-radius: 999px; background: transparent; color: #475569; font-weight: 800; font-size: 0.76rem; text-decoration: underline;">Keep anyway</span>
            </span>
          </span>
        </div>
      </div>

    </div>
  </div>
</div>
</x-dc>
</body>
</html>
