<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
  <style>
    body { margin: 0; font-family: 'Roboto', system-ui, -apple-system, sans-serif; }
    a { color: #e85a24; } a:hover { color: #cf4b1b; }
    * { box-sizing: border-box; }
  </style>
</helmet>

<div style="width: 390px; min-height: 900px; background: #0f172a; position: relative; overflow: hidden;">

  <!-- day builder dimmed behind -->
  <div style="filter: blur(2px); opacity: 0.4; pointer-events: none;">
    <div style="padding: 14px 16px 12px; display: flex; flex-direction: column; gap: 10px;">
      <div style="display: flex; gap: 8px;"><div style="width: 34px; height: 34px; border-radius: 10px; background: rgba(255,255,255,0.08);"></div><div style="flex: 1; height: 34px; border-radius: 10px; background: rgba(255,255,255,0.14);"></div><div style="width: 34px; height: 34px; border-radius: 10px; background: rgba(255,255,255,0.08);"></div><div style="width: 34px; height: 34px; border-radius: 10px; background: rgba(255,255,255,0.08);"></div></div>
      <div style="height: 40px; border-radius: 10px; background: rgba(255,255,255,0.06);"></div>
    </div>
    <div style="margin: 4px 12px; height: 520px; border-radius: 16px; background: #fff;"></div>
  </div>
  <div style="position: absolute; inset: 0; background: rgba(8,12,22,0.5);"></div>

  <!-- week picker sheet, dropped from the header stepper -->
  <div style="position: absolute; left: 12px; right: 12px; top: 14px; background: #fff; border-radius: 16px; box-shadow: 0 24px 48px rgba(8,12,22,0.45); padding: 16px 16px 18px;">

    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px;">
      <h2 style="margin: 0; font-size: 1rem; font-weight: 700; color: #14213d;">Jump to a week</h2>
      <span style="display: inline-flex; align-items: center; justify-content: center; width: 26px; height: 26px; border-radius: 999px; background: rgba(15,23,42,0.06); color: #475569;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg></span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px;">
      <span style="display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 14px; border: 1px solid rgba(15,23,42,0.1); border-radius: 11px; background: rgba(248,250,252,0.8);">
        <span><strong style="display: block; color: #14213d; font-size: 0.9rem;">Aug 25 &ndash; 31</strong><span style="font-size: 0.75rem; color: #475569;">Last week</span></span>
        <span style="display: inline-flex; align-items: center; gap: 6px; font-size: 0.72rem; font-weight: 800; color: #166534;"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>Published</span>
      </span>
      <span style="display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 14px; border: 1px solid #14213d; border-radius: 11px; background: #14213d;">
        <span><strong style="display: block; color: #fff; font-size: 0.9rem;">Sep 1 &ndash; 7</strong><span style="font-size: 0.75rem; color: rgba(248,250,252,0.7);">This week</span></span>
        <span style="display: inline-flex; align-items: center; gap: 6px; font-size: 0.72rem; font-weight: 800; color: #fbbf24;"><span style="width: 6px; height: 6px; border-radius: 999px; background: #f59e0b;"></span>Draft</span>
      </span>
      <span style="display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 14px; border: 1px solid rgba(15,23,42,0.1); border-radius: 11px; background: rgba(248,250,252,0.8);">
        <span><strong style="display: block; color: #14213d; font-size: 0.9rem;">Sep 8 &ndash; 14</strong><span style="font-size: 0.75rem; color: #475569;">Next week</span></span>
        <span style="font-size: 0.72rem; font-weight: 700; color: #94a3b8;">Not started</span>
      </span>
      <span style="display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 14px; border: 1px solid rgba(15,23,42,0.1); border-radius: 11px; background: rgba(248,250,252,0.8);">
        <span><strong style="display: block; color: #14213d; font-size: 0.9rem;">Sep 15 &ndash; 21</strong></span>
        <span style="font-size: 0.72rem; font-weight: 700; color: #94a3b8;">Not started</span>
      </span>
    </div>

    <div style="margin-top: 12px; padding-top: 12px; border-top: 1px solid rgba(15,23,42,0.08);">
      <div style="display: flex; align-items: center; gap: 10px; width: 100%; padding: 11px 14px; border: 1px solid rgba(203,213,225,0.92); border-radius: 10px; background: rgba(248,250,252,0.86); color: #475569; font-size: 0.86rem; font-weight: 600;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4M3 10h18"/></svg>
        Pick another date&hellip;
      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
