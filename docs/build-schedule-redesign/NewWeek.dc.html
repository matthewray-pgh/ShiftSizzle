<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
  <style>
    body { margin: 0; font-family: 'Roboto', system-ui, -apple-system, sans-serif; }
    a { color: #e85a24; } a:hover { color: #cf4b1b; }
    * { box-sizing: border-box; }
  </style>
</helmet>

<div style="width: 390px; min-height: 844px; background: #0f172a; padding: 0 0 24px;">

  <div style="padding: 14px 16px 12px; display: flex; flex-direction: column; gap: 10px;">
    <div style="display: flex; align-items: center; gap: 8px;">
      <button style="width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; border: 1px solid rgba(255,255,255,0.18); border-radius: 10px; background: rgba(255,255,255,0.06); color: #f8fafc;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
      <button style="flex: 1 1 auto; display: flex; align-items: center; justify-content: center; gap: 8px; height: 34px; border: 1px solid rgba(255,255,255,0.18); border-radius: 10px; background: rgba(255,255,255,0.06); color: #f8fafc; font: inherit; font-weight: 700; font-size: 0.95rem;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4M3 10h18"/></svg>Sep 8 – 14</button>
      <button style="width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; border: 1px solid rgba(255,255,255,0.18); border-radius: 10px; background: rgba(255,255,255,0.06); color: #f8fafc;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></button>
      <button style="width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; border: 1px solid rgba(255,255,255,0.18); border-radius: 10px; background: rgba(255,255,255,0.06); color: #f8fafc;"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg></button>
    </div>
    <div style="display: flex; align-items: center; gap: 10px;">
      <span style="display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; background: rgba(148,163,184,0.22); color: rgba(248,250,252,0.82); font-size: 0.72rem; font-weight: 800;"><span style="width: 6px; height: 6px; border-radius: 999px; background: #94a3b8;"></span>NEW WEEK</span>
      <span style="color: rgba(248,250,252,0.72); font-size: 0.78rem; font-weight: 500;">Nothing scheduled yet</span>
    </div>
  </div>

  <!-- new-week fork: replaces the working surface until a choice is made -->
  <div style="margin: 40px 20px 0; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px;">
    <div style="width: 56px; height: 56px; display: flex; align-items: center; justify-content: center; border-radius: 16px; background: rgba(255,255,255,0.06); color: #f8fafc; margin-bottom: 6px;">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4M3 10h18M8 14h4M8 18h8"/></svg>
    </div>
    <h2 style="margin: 0; font-size: 1.15rem; font-weight: 700; color: #f8fafc;">Start Sep 8 &ndash; 14</h2>
    <p style="margin: 0 0 20px; font-size: 0.86rem; line-height: 1.5; color: rgba(248,250,252,0.68); max-width: 300px;">
      Bring last week's assignments over &mdash; anything that no longer works gets flagged for you to fix &mdash; or begin from an empty week.
    </p>

    <button style="width: 100%; max-width: 320px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; border: 1px solid transparent; border-radius: 12px; background: linear-gradient(135deg, #ff6b35 0%, #e85a24 100%); color: #fff; font: inherit; font-weight: 700; font-size: 0.95rem; box-shadow: 0 14px 28px rgba(232,90,36,0.34); cursor: pointer;">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
      Copy last week
    </button>
    <button style="width: 100%; max-width: 320px; display: inline-flex; align-items: center; justify-content: center; min-height: 48px; border: 1px solid rgba(255,255,255,0.2); border-radius: 12px; background: rgba(255,255,255,0.05); color: #f8fafc; font: inherit; font-weight: 700; font-size: 0.95rem; cursor: pointer;">
      Start fresh
    </button>

    <p style="margin: 22px 0 0; font-size: 0.74rem; color: rgba(248,250,252,0.45);">Coverage targets always come from Settings &mdash; a changed target is never a copy conflict.</p>
  </div>
</div>
</x-dc>
</body>
</html>
