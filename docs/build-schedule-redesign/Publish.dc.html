<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
  <style>
    body { margin: 0; font-family: 'Roboto', system-ui, -apple-system, sans-serif; }
    a { color: #e85a24; } a:hover { color: #cf4b1b; }
    * { box-sizing: border-box; }
  </style>
</helmet>

<div style="width: 390px; min-height: 844px; background: #0f172a; position: relative; overflow: hidden;">

  <!-- dimmed backdrop suggestion -->
  <div style="filter: blur(2px); opacity: 0.4; pointer-events: none;">
    <div style="padding: 14px 16px 12px; display: flex; flex-direction: column; gap: 10px;">
      <div style="display: flex; gap: 8px;"><div style="width: 34px; height: 34px; border-radius: 10px; background: rgba(255,255,255,0.08);"></div><div style="flex: 1; height: 34px; border-radius: 10px; background: rgba(255,255,255,0.08);"></div><div style="width: 34px; height: 34px; border-radius: 10px; background: rgba(255,255,255,0.08);"></div></div>
      <div style="height: 40px; border-radius: 10px; background: rgba(255,255,255,0.06);"></div>
    </div>
    <div style="margin: 4px 12px; height: 500px; border-radius: 16px; background: #fff;"></div>
  </div>
  <div style="position: absolute; inset: 0; background: rgba(8,12,22,0.55);"></div>

  <!-- publish confirmation sheet -->
  <div style="position: absolute; left: 0; right: 0; bottom: 0; background: #fff; border-radius: 20px 20px 0 0; box-shadow: 0 -20px 44px rgba(8,12,22,0.4); padding: 18px 18px 22px;">
    <div style="width: 40px; height: 4px; border-radius: 999px; background: rgba(15,23,42,0.16); margin: 0 auto 16px;"></div>
    <h2 style="margin: 0 0 6px; font-size: 1.1rem; font-weight: 700; color: #14213d;">Publish this week?</h2>
    <p style="margin: 0 0 16px; font-size: 0.9rem; line-height: 1.5; color: #475569;">18 of 24 shifts filled. <strong style="color: #b45309;">6 shifts won't have anyone assigned</strong> if published now.</p>

    <div style="display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px;">
      <label style="display: flex; align-items: center; gap: 10px; padding: 11px 13px; border: 1px solid rgba(15,23,42,0.1); border-radius: 11px;">
        <span style="width: 18px; height: 18px; border-radius: 5px; background: linear-gradient(135deg, #ff6b35 0%, #e85a24 100%); display: flex; align-items: center; justify-content: center; color: #fff;"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></span>
        <span style="flex: 1; font-weight: 700; color: #14213d; font-size: 0.9rem;">Server</span>
        <span style="font-size: 0.76rem; font-weight: 800; color: #166534;">Complete</span>
      </label>
      <label style="display: flex; align-items: center; gap: 10px; padding: 11px 13px; border: 1px solid rgba(15,23,42,0.1); border-radius: 11px;">
        <span style="width: 18px; height: 18px; border-radius: 5px; background: linear-gradient(135deg, #ff6b35 0%, #e85a24 100%); display: flex; align-items: center; justify-content: center; color: #fff;"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></span>
        <span style="flex: 1; font-weight: 700; color: #14213d; font-size: 0.9rem;">Host</span>
        <span style="font-size: 0.76rem; font-weight: 800; color: #166534;">Complete</span>
      </label>
      <label style="display: flex; align-items: center; gap: 10px; padding: 11px 13px; border: 1px solid rgba(15,23,42,0.1); border-radius: 11px;">
        <span style="width: 18px; height: 18px; border-radius: 5px; border: 1.5px solid rgba(15,23,42,0.28); background: #fff;"></span>
        <span style="flex: 1; font-weight: 700; color: #14213d; font-size: 0.9rem;">Cook</span>
        <span style="font-size: 0.76rem; font-weight: 800; color: #b45309;">4 open</span>
      </label>
      <label style="display: flex; align-items: center; gap: 10px; padding: 11px 13px; border: 1px solid rgba(15,23,42,0.1); border-radius: 11px;">
        <span style="width: 18px; height: 18px; border-radius: 5px; border: 1.5px solid rgba(15,23,42,0.28); background: #fff;"></span>
        <span style="flex: 1; font-weight: 700; color: #14213d; font-size: 0.9rem;">Bartender</span>
        <span style="font-size: 0.76rem; font-weight: 800; color: #b45309;">2 open</span>
      </label>
    </div>

    <div style="display: flex; gap: 10px;">
      <button style="flex: 1; min-height: 44px; border: 1px solid rgba(203,213,225,0.94); border-radius: 10px; background: #fff; color: #0f172a; font: inherit; font-weight: 700; font-size: 0.88rem; cursor: pointer;">Go back and fix</button>
      <button style="flex: 1; min-height: 44px; border: 1px solid transparent; border-radius: 10px; background: linear-gradient(135deg, #ff6b35 0%, #e85a24 100%); color: #fff; font: inherit; font-weight: 700; font-size: 0.88rem; box-shadow: 0 12px 24px rgba(232,90,36,0.3); cursor: pointer;">Publish selected</button>
    </div>

    <p style="margin: 14px 2px 0; font-size: 0.76rem; color: #94a3b8;">Complete roles pre-checked, incomplete held back. A fully-filled week with no filter skips this sheet &mdash; it publishes instantly with an undo toast.</p>
  </div>

  <!-- undo toast (instant-publish path) -->
  <div style="position: absolute; left: 50%; bottom: 340px; transform: translateX(-50%); display: flex; align-items: center; gap: 16px; padding: 12px 16px; border-radius: 12px; background: #14213d; color: #fff; font-size: 0.9rem; font-weight: 600; box-shadow: 0 12px 32px rgba(8,12,22,0.5);">
    <span>Published</span>
    <span style="color: #fdba74; font-weight: 800;">Undo</span>
  </div>
</div>
</x-dc>
</body>
</html>
