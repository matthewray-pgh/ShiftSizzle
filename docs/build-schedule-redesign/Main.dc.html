<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
  <style>
    body { margin: 0; font-family: 'Roboto', system-ui, -apple-system, sans-serif; }
    a { color: #e85a24; } a:hover { color: #cf4b1b; }
    * { box-sizing: border-box; }
  </style>
</helmet>

<div style="width: 390px; min-height: 844px; background: #0f172a; padding: 0 0 24px;">

  <!-- ===== sticky action bar (replaces page-header + Week panel + Checklist panel) ===== -->
  <div style="position: sticky; top: 0; background: #0f172a; padding: 14px 16px 12px; display: flex; flex-direction: column; gap: 10px;">

    <div style="display: flex; align-items: center; gap: 8px;">
      <button style="width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; border: 1px solid rgba(255,255,255,0.18); border-radius: 10px; background: rgba(255,255,255,0.06); color: #f8fafc; cursor: pointer;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <button style="flex: 1 1 auto; display: flex; align-items: center; justify-content: center; gap: 8px; height: 34px; border: 1px solid rgba(255,255,255,0.18); border-radius: 10px; background: rgba(255,255,255,0.06); color: #f8fafc; font: inherit; font-weight: 700; font-size: 0.95rem; cursor: pointer;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4M3 10h18"/></svg>
        Sep 1 – 7
      </button>
      <button style="width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; border: 1px solid rgba(255,255,255,0.18); border-radius: 10px; background: rgba(255,255,255,0.06); color: #f8fafc; cursor: pointer;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
      </button>
      <button style="width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; border: 1px solid rgba(255,255,255,0.18); border-radius: 10px; background: rgba(255,255,255,0.06); color: #f8fafc; cursor: pointer;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>
      </button>
    </div>

    <div style="display: flex; align-items: center; gap: 10px;">
      <span style="display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; background: rgba(245,158,11,0.18); color: #fbbf24; font-size: 0.72rem; font-weight: 800; letter-spacing: 0.02em;">
        <span style="width: 6px; height: 6px; border-radius: 999px; background: #f59e0b;"></span>DRAFT
      </span>
      <span style="color: rgba(248,250,252,0.72); font-size: 0.78rem; font-weight: 500;">18 / 24 filled&nbsp;&middot;&nbsp;Saved</span>
      <span style="flex: 1 1 auto;"></span>
      <button style="display: inline-flex; align-items: center; justify-content: center; height: 40px; padding: 0 20px; border: 1px solid transparent; border-radius: 10px; background: linear-gradient(135deg, #ff6b35 0%, #e85a24 100%); color: #fff; font: inherit; font-weight: 700; font-size: 0.9rem; box-shadow: 0 12px 24px rgba(232,90,36,0.32); cursor: pointer;">
        Publish
      </button>
    </div>
  </div>

  <!-- ===== the working surface (white, floats on navy) ===== -->
  <div style="margin: 4px 12px 0; background: #fff; border: 1px solid rgba(203,213,225,0.55); border-radius: 16px; box-shadow: 0 16px 34px rgba(15,23,42,0.28); padding: 14px 14px 18px;">

    <!-- role filter + Day/Week toggle: the ONLY control row -->
    <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 12px;">
      <div style="display: flex; gap: 7px; overflow-x: auto; flex: 1 1 auto; padding-bottom: 2px;">
        <span style="flex: 0 0 auto; display: inline-flex; align-items: center; gap: 6px; padding: 7px 13px; border-radius: 999px; background: #14213d; color: #fff; font-size: 0.82rem; font-weight: 700;">All <span style="padding: 0 6px; border-radius: 999px; background: rgba(255,255,255,0.22); font-size: 0.68rem; font-weight: 800;">12</span></span>
        <span style="flex: 0 0 auto; display: inline-flex; align-items: center; gap: 6px; padding: 7px 13px; border-radius: 999px; background: #fff; border: 1px solid rgba(15,23,42,0.12); color: #475569; font-size: 0.82rem; font-weight: 700;">Server <span style="padding: 0 6px; border-radius: 999px; background: rgba(220,38,38,0.16); color: #dc2626; font-size: 0.68rem; font-weight: 800;">8</span></span>
        <span style="flex: 0 0 auto; display: inline-flex; align-items: center; gap: 6px; padding: 7px 13px; border-radius: 999px; background: #fff; border: 1px solid rgba(15,23,42,0.12); color: #475569; font-size: 0.82rem; font-weight: 700;">Cook <span style="padding: 0 6px; border-radius: 999px; background: rgba(220,38,38,0.16); color: #dc2626; font-size: 0.68rem; font-weight: 800;">4</span></span>
        <span style="flex: 0 0 auto; padding: 7px 13px; border-radius: 999px; background: #fff; border: 1px solid rgba(15,23,42,0.12); color: #475569; font-size: 0.82rem; font-weight: 700;">Host</span>
      </div>
      <div style="flex: 0 0 auto; display: inline-flex; padding: 3px; border-radius: 999px; background: rgba(15,23,42,0.06);">
        <span style="padding: 6px 12px; border-radius: 999px; background: #fff; color: #14213d; font-size: 0.78rem; font-weight: 800; box-shadow: 0 1px 2px rgba(15,23,42,0.12);">Day</span>
        <span style="padding: 6px 12px; border-radius: 999px; color: #475569; font-size: 0.78rem; font-weight: 800;">Week</span>
      </div>
    </div>

    <!-- day tab strip -->
    <div style="display: flex; gap: 6px; overflow-x: auto; margin-bottom: 14px; padding-bottom: 2px;">
      <span style="flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 44px; padding: 7px 9px; border: 1px solid rgba(15,23,42,0.12); border-radius: 12px; background: #fff; color: #475569;"><span style="font-size: 0.66rem; font-weight: 800; letter-spacing: 0.04em;">SUN</span><span style="font-size: 0.95rem; font-weight: 700;">1</span></span>
      <span style="flex: 0 0 auto; position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 44px; padding: 7px 9px; border: 1px solid #14213d; border-radius: 12px; background: #14213d; color: #fff;"><span style="font-size: 0.66rem; font-weight: 800; letter-spacing: 0.04em;">MON</span><span style="font-size: 0.95rem; font-weight: 700;">2</span></span>
      <span style="flex: 0 0 auto; position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 44px; padding: 7px 9px; border: 1px solid rgba(15,23,42,0.12); border-radius: 12px; background: #fff; color: #475569;"><span style="position: absolute; top: 5px; right: 6px; width: 7px; height: 7px; border-radius: 999px; background: #f59e0b;"></span><span style="font-size: 0.66rem; font-weight: 800; letter-spacing: 0.04em;">TUE</span><span style="font-size: 0.95rem; font-weight: 700;">3</span></span>
      <span style="flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 44px; padding: 7px 9px; border: 1px solid rgba(15,23,42,0.12); border-radius: 12px; background: #fff; color: #475569;"><span style="font-size: 0.66rem; font-weight: 800; letter-spacing: 0.04em;">WED</span><span style="font-size: 0.95rem; font-weight: 700;">4</span></span>
      <span style="flex: 0 0 auto; position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 44px; padding: 7px 9px; border: 1px solid rgba(15,23,42,0.12); border-radius: 12px; background: #fff; color: #475569;"><span style="position: absolute; top: 5px; right: 6px; width: 7px; height: 7px; border-radius: 999px; background: #f59e0b;"></span><span style="font-size: 0.66rem; font-weight: 800; letter-spacing: 0.04em;">THU</span><span style="font-size: 0.95rem; font-weight: 700;">5</span></span>
      <span style="flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 44px; padding: 7px 9px; border: 1px solid rgba(15,23,42,0.12); border-radius: 12px; background: #fff; color: #475569;"><span style="font-size: 0.66rem; font-weight: 800; letter-spacing: 0.04em;">FRI</span><span style="font-size: 0.95rem; font-weight: 700;">6</span></span>
    </div>

    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px;">
      <h3 style="margin: 0; font-size: 1rem; font-weight: 700; color: #14213d;">Monday, Sep 2</h3>
      <button style="display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border: 1px solid rgba(203,213,225,0.94); border-radius: 10px; background: #fff; color: #14213d; font: inherit; font-weight: 700; font-size: 0.78rem; cursor: pointer;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3l1.7 4.8L18.5 9.5l-4.8 1.7L12 16l-1.7-4.8L5.5 9.5l4.8-1.7z"/></svg>
        Auto-fill
      </button>
    </div>

    <!-- shift cards -->
    <div style="display: flex; flex-direction: column; gap: 12px;">

      <!-- full -->
      <div style="padding: 13px; border: 1px solid rgba(15,23,42,0.1); border-left: 4px solid rgba(34,197,94,0.6); border-radius: 12px; background: rgba(248,250,252,0.7);">
        <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 10px;">
          <div style="display: flex; align-items: baseline; gap: 8px;"><strong style="color: #14213d; font-size: 0.95rem;">Server</strong><span style="color: #475569; font-size: 0.84rem;">11a&ndash;4p</span></div>
          <span style="font-weight: 800; font-size: 0.85rem; color: #166534;">2/2</span>
        </div>
        <div style="display: flex; flex-wrap: wrap; gap: 8px;">
          <span style="display: inline-flex; align-items: center; gap: 6px; padding: 5px 6px 5px 12px; border-radius: 999px; background: #fff; border: 1px solid rgba(15,23,42,0.12); font-size: 0.83rem; font-weight: 600; color: #14213d;">Maria Chen <span style="display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px; border-radius: 999px; background: rgba(15,23,42,0.08); color: #475569;"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg></span></span>
          <span style="display: inline-flex; align-items: center; gap: 6px; padding: 5px 6px 5px 12px; border-radius: 999px; background: #fff; border: 1px solid rgba(15,23,42,0.12); font-size: 0.83rem; font-weight: 600; color: #14213d;">Devon Blake <span style="display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px; border-radius: 999px; background: rgba(15,23,42,0.08); color: #475569;"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg></span></span>
        </div>
      </div>

      <!-- partial -->
      <div style="padding: 13px; border: 1px solid rgba(15,23,42,0.1); border-left: 4px solid rgba(245,158,11,0.7); border-radius: 12px; background: rgba(248,250,252,0.7);">
        <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 10px;">
          <div style="display: flex; align-items: baseline; gap: 8px;"><strong style="color: #14213d; font-size: 0.95rem;">Server</strong><span style="color: #475569; font-size: 0.84rem;">4p&ndash;close</span></div>
          <span style="font-weight: 800; font-size: 0.85rem; color: #b45309;">1/3</span>
        </div>
        <div style="display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px;">
          <span style="display: inline-flex; align-items: center; gap: 6px; padding: 5px 6px 5px 12px; border-radius: 999px; background: #fff; border: 1px solid rgba(15,23,42,0.12); font-size: 0.83rem; font-weight: 600; color: #14213d;">Priya Nair <span style="display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px; border-radius: 999px; background: rgba(15,23,42,0.08); color: #475569;"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg></span></span>
        </div>
        <button style="display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border: 1px dashed rgba(15,23,42,0.28); border-radius: 10px; background: none; color: #1d4ed8; font: inherit; font-weight: 700; font-size: 0.83rem; cursor: pointer;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg> Add person
        </button>
      </div>

      <!-- none -->
      <div style="padding: 13px; border: 1px solid rgba(15,23,42,0.1); border-left: 4px solid rgba(239,68,68,0.65); border-radius: 12px; background: rgba(248,250,252,0.7);">
        <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 10px;">
          <div style="display: flex; align-items: baseline; gap: 8px;"><strong style="color: #14213d; font-size: 0.95rem;">Cook</strong><span style="color: #475569; font-size: 0.84rem;">11a&ndash;close</span></div>
          <span style="font-weight: 800; font-size: 0.85rem; color: #b91c1c;">0/1</span>
        </div>
        <div style="display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px;">
          <span style="color: #475569; font-size: 0.83rem; font-style: italic;">No one assigned</span>
        </div>
        <button style="display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border: 1px dashed rgba(15,23,42,0.28); border-radius: 10px; background: none; color: #1d4ed8; font: inherit; font-weight: 700; font-size: 0.83rem; cursor: pointer;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg> Add person
        </button>
      </div>

    </div>
  </div>
</div>
</x-dc>
</body>
</html>
